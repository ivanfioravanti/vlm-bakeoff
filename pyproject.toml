[project]
name = "vlm-bakeoff"
version = "0.1.0"
description = "VLM bake-off — MLX vs GGUF: identical vision benchmarks across mlx-vlm and llama.cpp on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "mlx-vlm",
    "pillow",
    "huggingface-hub",
    "datasets",
    # Apple Core AI backend (.aimodel bundles). Marker-scoped instead of an
    # optional extra because `uv run` re-syncs to default deps and would strip
    # extras mid-session. Import is guarded (coreai_available) for macOS < 27.
    "coreai-core>=1.0.0b2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

# LFM2.5-VL image-splitting (tiling) — PR Blaizzy/mlx-vlm#1885, plus the
# lfm2_vl batch_generate fix (nested per-prompt images + padded batched text).
# Points at the branches on GitHub so no local checkout is needed; uv.lock
# pins the exact commit. Switch to the released mlx-vlm (delete this block
# and relock) once the fixes ship.
[tool.uv.sources]
mlx-vlm = { git = "https://github.com/ivanfioravanti/mlx-vlm", branch = "lfm2vl-batch-fix" }
