[project]
name = "vlm-bakeoff"
version = "0.1.0"
description = "VLM bake-off — MLX vs GGUF: identical vision benchmarks across mlx-vlm and llama.cpp on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "mlx-vlm",
    "pillow",
    "huggingface-hub",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

# LFM2.5-VL image-splitting (tiling) — PR Blaizzy/mlx-vlm#1885.
# Points at the PR branch on GitHub so no local checkout is needed; uv.lock
# pins the exact commit. Switch to the released mlx-vlm (delete this block
# and relock) once the fix ships.
[tool.uv.sources]
mlx-vlm = { git = "https://github.com/ivanfioravanti/mlx-vlm", branch = "fix/lfm2vl-image-splitting" }
